version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

    # Environment variables for Colony connection
    environment:
      # Colony server configuration
      - COLONIES_HOST=localhost
      - COLONIES_PORT=50080
      - COLONIES_TLS=false

      # Authentication keys (replace with your actual keys)
      - COLONIES_SERVER_PRV_KEY=your-server-private-key-here
      - COLONIES_COLONY_PRV_KEY=your-colony-private-key-here
      - COLONIES_PRV_KEY=your-user-private-key-here

      # Optional configuration
      - COLONIES_COLONY_NAME=your-colony-name
      - COLONIES_EXECUTOR_ID=your-executor-id
      - COLONIES_USERNAME=your-username
      - COLONIES_FIRSTNAME=Your
      - COLONIES_LASTNAME=Name
      - COLONIES_EMAIL=your-email@example.com

      # AWS S3 configuration (optional)
      # - COLONIES_AWS_S3_ENDPOINT=https://s3.amazonaws.com
      # - COLONIES_AWS_S3_ACCESSKEY=your-access-key
      # - COLONIES_AWS_S3_SECRETKEY=your-secret-key
      # - COLONIES_AWS_S3_REGION=us-east-1
      # - COLONIES_AWS_S3_BUCKET=your-bucket-name
      # - COLONIES_AWS_S3_TLS=true

    # Alternative: Load from .env file
    # env_file:
    #   - .env

    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Security
    security_opt:
      - no-new-privileges:true

    # Labels for monitoring/management
    labels:
      - "app=colonies-dashboard"
      - "environment=production"
      - "maintainer=your-team"